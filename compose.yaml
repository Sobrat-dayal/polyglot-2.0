services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - polyglot-data:/app/backend/data
    environment:
      POLYGLOT_DATABASE_PATH: /app/backend/data/polyglot.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  polyglot-data:
